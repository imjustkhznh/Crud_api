<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Push Notifications</title>
</head>
<body>
  <ul id="todoList"></ul>

<script>
async function loadTodos() {
  const res = await fetch('http://localhost:3000/todos');
  const todos = await res.json();

  const list = document.getElementById('todoList');
  list.innerHTML = '';

  todos.forEach(todo => {
    const li = document.createElement('li');
    li.innerHTML = `
      <input type="checkbox" ${todo.isDone ? 'checked' : ''} onchange="toggleDone(${todo.id}, this.checked)">
      ${todo.content} (due: ${new Date(todo.dueAt).toLocaleTimeString()})
    `;
    list.appendChild(li);
  });
}

async function toggleDone(id, done) {
  await fetch(`http://localhost:3000/todos/${id}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ isDone: done })
  });
  loadTodos();
}

loadTodos();
</script>

</body>
</html>
